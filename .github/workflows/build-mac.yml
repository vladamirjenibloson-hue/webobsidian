name: Build WebObsidian for macOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-mac:
    name: Build unsigned macOS installers (arm64 + x64)
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web and server
        run: npm run build

      - name: Package macOS DMG and ZIP
        run: npm --workspace desktop run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: WebObsidian-macOS
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
          if-no-files-found: error
          retention-days: 14
